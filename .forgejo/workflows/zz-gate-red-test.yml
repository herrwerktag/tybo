# WEGWERF-Test: prueft den roten Pfad des Pruef-Gates. Wird nach dem Test geloescht.
# Identisch zu agent-issue.yml, aber Trigger-Label 'gatered' und Pruefung schlaegt garantiert fehl.
name: Gate Rot-Test
on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'gatered'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repo auschecken
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aufgabe aus dem Issue ableiten
        id: task
        run: |
          echo "Rot-Test: nur das Gate wird geprueft, keine echte Aufgabe." > /tmp/task.md

      - name: Node bereitstellen
        uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: "22"

      - name: pnpm bereitstellen
        run: npm install -g pnpm@12.8.1

      # Kein OpenCode, kein Modell: nur eine Aenderung, damit "Ergebnis pushen" ueberhaupt etwas faende.
      - name: Simulierte Aenderung
        run: echo "simuliert" > /tmp/sim.md && cp /tmp/sim.md SIMULIERT.md

      - name: Pruefung (simulierter Fehlschlag)
        id: verify
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "### Pruefung: \`pnpm check\`"
            echo
            echo '```'
            echo "SIMULIERTER FEHLSCHLAG - so sieht ein rotes Gate aus."
            exit 1
            echo '```'
          } > /tmp/verify.md 2>&1
          RC=$?
          echo "exit=$RC"
          cat /tmp/verify.md
          if [ "$RC" -eq 0 ]; then echo "passed=true" >> $GITHUB_OUTPUT; else echo "passed=false" >> $GITHUB_OUTPUT; fi
          exit 0

      - name: Ergebnis pushen
        id: push
        if: steps.verify.outputs.passed == 'true'
        run: |
          BR="agent/gatered-${{ github.event.issue.number }}"
          git checkout -b "$BR"
          git add -A
          git commit -m "Rot-Test haette gepusht"
          git push origin "$BR"
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "branch=$BR" >> $GITHUB_OUTPUT

      - name: Pull Request oeffnen
        if: steps.push.outputs.changed == 'true'
        env:
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
        run: |
          echo "PR haette geoeffnet - bei rotem Gate darf das NICHT passieren."
          exit 1

      - name: Meldung ans Issue, wenn die Pruefung fehlschlug
        if: steps.verify.outputs.passed != 'true'
        env:
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
          BODY_FILE: /tmp/verify.md
          ISSUE: ${{ github.event.issue.number }}
        run: |
          python3 -c "import json,os;b=open(os.environ['BODY_FILE']).read();print(json.dumps({'body':(b[:60000] if b.strip() else 'Pruefung fehlgeschlagen, aber keine Ausgabe erfasst.')}))" > /tmp/note.json
          curl -sS -X POST -H "Authorization: token $AGENT_TOKEN" -H "Content-Type: application/json" \
            --data @/tmp/note.json "http://forgejo:3000/api/v1/repos/${{ github.repository }}/issues/$ISSUE/comments"
          echo
