# Anforderung als Forgejo-Issue mit Label "agent" -> Pi Coding Agent arbeitet sie ab -> Pruefung -> PR.
name: Agent Issue
on:
  issues:
    types: [labeled]

jobs:
  implement:
    # nur wenn das Label "agent" gesetzt wurde
    if: github.event.label.name == 'agent'
    runs-on: ubuntu-latest
    # Obergrenze: bei Haenger (Modell gestresst/Reasoning-Schleife) nicht stundenlang laufen
    timeout-minutes: 90
    steps:
      - name: Repo auschecken
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aufgabe aus dem Issue ableiten
        id: task
        run: |
          {
            echo "## Aufgabe"
            echo "${{ github.event.issue.title }}"
            echo
            echo "## Beschreibung"
            echo "${{ github.event.issue.body }}"
            echo
            echo "## Hinweise zum Repo"
            echo "- Branch: ${{ github.ref_name }}"
            echo "- Bearbeite nur, was die Aufgabe verlangt."
          } > /tmp/task.md
          echo "Aufgabe:"; cat /tmp/task.md

      - name: Node bereitstellen
        uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          # Pi verlangt Node >= 22.19
          node-version: "22.19"

      - name: pnpm bereitstellen
        run: npm install -g pnpm@12.8.1

      - name: Pi installieren
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.0.3

      - name: Pi konfigurieren (synthetic-Endpunkt, GLM-5.3 mit Reasoning)
        env:
          SYNTHETIC_API_KEY: ${{ secrets.SYNTHETIC_API_KEY }}
        run: |
          mkdir -p "$HOME/.pi/agent"
          # Bewusst per Python statt Heredoc: die Heredoc-Einrueckung im YAML hat
          # frueher schon ungueltiges JSON erzeugt. Der Schluessel wird ueber
          # $SYNTHETIC_API_KEY eingefuegt und erst zur Anfragezeit aufgeloest.
          python3 - <<'PY'
          import json, os, pathlib
          cfg = {
              "providers": {
                  "synthetic": {
                      "baseUrl": "https://api.synthetic.new/openai/v1",
                      "api": "openai-completions",
                      "apiKey": "$SYNTHETIC_API_KEY",
                      "models": [
                          {
                              "id": "hf:zai-org/GLM-5.3",
                              "name": "GLM-5.3",
                              "reasoning": True,
                              "contextWindow": 524288,
                              "maxTokens": 65536,
                          }
                      ],
                  }
              }
          }
          p = pathlib.Path(os.environ["HOME"]) / ".pi" / "agent" / "models.json"
          p.write_text(json.dumps(cfg, indent=2) + "\n")
          json.loads(p.read_text())
          print("models.json ok:", p)
          PY
          cat "$HOME/.pi/agent/models.json"

      - name: Pi arbeiten lassen
        id: agent
        continue-on-error: true
        env:
          SYNTHETIC_API_KEY: ${{ secrets.SYNTHETIC_API_KEY }}
        run: |
          git config user.name  "agent-bot"
          git config user.email "agent-bot@werkbank.local"
          {
            echo "### Ausgabe von Pi"
            echo
            echo '```'
            # -na: projektlokale Konfiguration ignorieren (der Agent darf sich nicht selbst steuern)
            pi -na --provider synthetic --model hf:zai-org/GLM-5.3 --print "$(cat /tmp/task.md)"
            echo '```'
          } > /tmp/agent.md 2>&1
          RC=$?
          echo "Pi exit=$RC"
          tail -30 /tmp/agent.md
          echo "rc=$RC" >> $GITHUB_OUTPUT
          exit 0

      # Pruef-Gate: ohne gruene Pruefung entsteht KEIN PR fuer den Nutzer.
      - name: Pruefung (typecheck + tests + build)
        id: verify
        continue-on-error: true
        env:
          # Postgres fuer die Datenbank-Tests des API-Pakets; ohne das Secret werden sie uebersprungen.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          {
            echo "### Pruefung: \`pnpm check\`"
            echo
            echo '```'
            pnpm install --frozen-lockfile && pnpm check
            echo '```'
          } > /tmp/verify.md 2>&1
          RC=$?
          echo "exit=$RC"
          tail -25 /tmp/verify.md
          if [ "$RC" -eq 0 ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
          fi
          exit 0

      - name: Ergebnis pushen
        id: push
        if: steps.verify.outputs.passed == 'true'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Keine Aenderungen erzeugt."
            exit 0
          fi
          # Schranke: der Agent darf die Pipeline, die ihn steuert, NICHT veraendern.
          # Aenderungen unter .forgejo/ werden vor dem Commit zurueckgesetzt und gemeldet.
          if ! git diff --quiet -- .forgejo 2>/dev/null || [ -n "$(git status --porcelain -- .forgejo)" ]; then
            echo "HINWEIS: Der Agent hat .forgejo/ veraendert. Die Aenderung wird NICHT uebernommen."
            git checkout -- .forgejo 2>/dev/null || true
            git clean -fdq .forgejo 2>/dev/null || true
          fi
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Nach dem Zuruecksetzen von .forgejo gab es keine Aenderungen."
            exit 0
          fi
          BR="agent/issue-${{ github.event.issue.number }}"
          git checkout -b "$BR"
          git add -A
          git commit -m "Agent: Issue #${{ github.event.issue.number }} bearbeitet"
          git push origin "$BR"
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "branch=$BR" >> $GITHUB_OUTPUT

      - name: Pull Request oeffnen
        if: steps.push.outputs.changed == 'true'
        env:
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
          B: ${{ steps.push.outputs.branch }}
          G: ${{ github.ref_name }}
          T: "Agent: ${{ github.event.issue.title }}"
          D: "Bearbeitet durch Pi Coding Agent (GLM-5.3). Schliesst #${{ github.event.issue.number }}"
        run: |
          python3 -c "import json,os;print(json.dumps({'head':os.environ['B'],'base':os.environ['G'],'title':os.environ['T'],'body':os.environ['D']}))" > /tmp/pr.json
          cat /tmp/pr.json
          curl -sS -o /tmp/prresp.json -X POST -H "Authorization: token $AGENT_TOKEN" -H "Content-Type: application/json" \
            --data @/tmp/pr.json "http://forgejo:3000/api/v1/repos/${{ github.repository }}/pulls"
          echo

      # Genau EINE Meldung pro Lauf: PR-Link, "keine Aenderungen" oder Fehlertext.
      # Folge: Ein Lauf OHNE Kommentar ist abgebrochen (z.B. Timeout) und muss nachgesehen werden.
      - name: Ergebnis melden
        if: always()
        env:
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          PASSED: ${{ steps.verify.outputs.passed }}
          CHANGED: ${{ steps.push.outputs.changed }}
          AGENT_RC: ${{ steps.agent.outputs.rc }}
          BRANCH: ${{ steps.push.outputs.branch }}
        run: |
          {
            echo "### Ergebnis des Agent-Laufs"
            echo
            if [ "$PASSED" != "true" ]; then
              echo "**Pruefung fehlgeschlagen** — kein Pull Request erzeugt."
              echo
              if [ -s /tmp/verify.md ]; then
                echo '```'
                cat /tmp/verify.md
                echo '```'
              else
                echo "_Keine Ausgabe erfasst (Lauf moeglicherweise abgebrochen)._"
              fi
            elif [ "$CHANGED" != "true" ]; then
              echo "**Pruefung gruen**, aber es wurden keine Aenderungen erzeugt — kein Pull Request."
              echo
              echo "Pi Exit-Code: \`$AGENT_RC\`"
              echo
              if [ -s /tmp/agent.md ]; then
                echo "<details><summary>Ausgabe von Pi</summary>"
                echo
                echo '```'
                tail -60 /tmp/agent.md
                echo '```'
                echo
                echo "</details>"
              else
                echo "_Pi hat keine Ausgabe erzeugt._"
              fi
            else
              NUM=$(python3 -c "import json;print(json.load(open('/tmp/prresp.json')).get('number',''))" 2>/dev/null || echo "")
              if [ -n "$NUM" ]; then
                echo "**Pruefung gruen — Pull Request eroeffnet:** #$NUM (Branch \`$BRANCH\`)"
              else
                echo "**Pruefung gruen**, Branch \`$BRANCH\` gepusht, aber die PR-Nummer war nicht lesbar:"
                echo '```'
                cat /tmp/prresp.json 2>/dev/null || echo "(keine Antwort)"
                echo '```'
              fi
            fi
          } > /tmp/report.md
          cat /tmp/report.md
          python3 -c "import json;b=open('/tmp/report.md').read();print(json.dumps({'body':b[:60000]}))" > /tmp/report.json
          curl -sS -o /dev/null -w "Meldung: HTTP %{http_code}\n" -X POST -H "Authorization: token $AGENT_TOKEN" -H "Content-Type: application/json" \
            --data @/tmp/report.json "http://forgejo:3000/api/v1/repos/${{ github.repository }}/issues/$ISSUE/comments"
